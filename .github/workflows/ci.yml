name: Pipecat integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent package dependencies
        run: python -m pip install -e '.[dev]' black ruff
      - name: Format and lint
        run: |
          black --check .
          ruff check .
      - name: Offline protocol tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
